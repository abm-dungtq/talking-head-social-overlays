name: Validate skill

on:
  push:
  pull_request:

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify JavaScript syntax
        run: |
          node --check skill/scripts/scaffold.mjs
          node --check skill/scripts/build.mjs
          node --check skill/scripts/self-test.mjs
      - name: Run portable self-test
        run: node skill/scripts/self-test.mjs
